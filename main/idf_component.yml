dependencies:
  idf: ">=5.5,<6.1"
  # Pinned on purpose (branch video, 2026-09-16). LVGL comes in through the
  # BSP and esp_lvgl_port as "^9", and any change to this manifest makes the
  # component manager re-solve it: it jumped from 9.5.0 to 9.6.0 on its own,
  # the symbol table stopped linking, and the apps and the simulator (which
  # share LVGL's structures with the firmware) were still on 9.5.0. That is
  # the silent-corruption case build_apps.sh warns about. The apps pin the
  # same version; moving LVGL is a deliberate step for all three at once.
  lvgl/lvgl:
    version: "==9.5.0"
    public: true
  waveshare/esp32_s3_touch_amoled_1_8:
    version: "^2.0.3"
    public: true
  waveshare/qmi8658:
    version: "^2.0.0"
    public: true
  waveshare/pcf85063a:
    version: "^2.0.0"
    public: true
  espressif/elf_loader:
    version: "^1.3.3"
    public: true
    # Copia local en components/elf_loader con un arreglo de alineamiento de
    # secciones que el upstream no tiene (ver el comentario en esp_elf.c).
    # Sin override_path el gestor de dependencias restaura la version original.
    override_path: "../components/elf_loader"
  espressif/mdns:
    version: "^1.8.0"
    public: true
  # JPEG decoder with the S3's SIMD paths (branch video). Prebuilt library, so
  # it lives in the firmware and the apps reach it through the symbol table.
  espressif/esp_new_jpeg:
    version: "^1.0.2"
    public: true
  # H.264 decoder (branch rtsp): software, constrained baseline only, the S3
  # has no video block. Prebuilt like esp_new_jpeg, so it lives here too.
  espressif/esp_h264:
    version: "^1.4.1"
    public: true
  # USB (branch usb, see docs/USB.md). Device side: TinyUSB through Espressif's
  # wrapper. Host side: the class drivers from esp-usb.
  espressif/esp_tinyusb:
    version: "^2.2.1"
  espressif/usb_host_msc:
    version: "^1.2.0"
  espressif/usb_host_hid:
    version: "^1.2.1"
  espressif/usb_host_cdc_acm:
    version: "^2.4.1"
  espressif/usb_host_uvc:
    version: "^2.5.2"
