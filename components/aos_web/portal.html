<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmoledOS - Archivos</title>
<link rel="stylesheet" href="/aos.css">
<style>
  /* Pestanas del explorador de archivos. No son las paginas del portal -esas
     las dibuja aos.js en .paginas- sino carpetas de esta misma pagina. */
  .carpetas { display: flex; gap: 8px; margin-bottom: 16px; }
  .carpetas button {
    flex: 1; padding: 10px; border-radius: 12px;
    background: var(--card); color: var(--dim); font-weight: 500;
  }
  .carpetas button.on { background: var(--accent); color: #fff; }

  #soltar {
    border: 2px dashed var(--card2); border-radius: 18px; padding: 28px 16px;
    text-align: center; color: var(--dim); margin-bottom: 18px;
    transition: border-color .15s, background .15s;
  }
  #soltar.caliente { border-color: var(--accent); background: rgba(10,132,255,.08); }
  #soltar b { color: var(--text); }
  #elegir { color: var(--accent); text-decoration: underline; cursor: pointer; }

  ul.lista li a.act {
    background: var(--card2); color: var(--accent); text-decoration: none;
    border-radius: 9px; padding: 6px 12px; font-size: 13px; white-space: nowrap;
  }
  ul.lista li button { padding: 6px 12px; font-size: 13px; border-radius: 9px;
                       background: var(--card2); color: var(--red); }
  .ruta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: -6px 0 14px;
          font-size: 13.5px; }
  .ruta a { color: var(--accent); text-decoration: none; }
  .ruta span.sep { color: var(--dim); }
  .ruta b { font-weight: 500; }
  .ruta button { margin-left: auto; }
  ul.lista li.carpeta .nombre::before { content: "\1F4C1  "; }
  ul.lista li.carpeta { cursor: pointer; }
  ul.lista li.carpeta:hover { background: var(--card2); }
  #previa { margin: 0 0 14px; text-align: center; }
  #previa img { max-width: 100%; max-height: 448px; border-radius: 14px; background: #000; }
  #previa .pie { color: var(--dim); font-size: 12.5px; margin-top: 6px; }

  #barra { height: 4px; background: var(--card2); border-radius: 2px;
           overflow: hidden; margin-bottom: 14px; display: none; }
  #barra i { display: block; height: 100%; width: 0; background: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1 data-t="titulo">Archivos</h1></div>
  <p class="sub" data-t="bajada">Lo que hay en la microSD, por carpeta. Arrastrá
     para subir; tocá una foto para verla.</p>

  <nav class="paginas"></nav>

  <div class="carpetas">
    <button data-dir="apps" class="on" data-t="car_apps">Apps</button>
    <button data-dir="photos" data-t="car_fotos">Fotos</button>
    <button data-dir="music" data-t="car_musica">Musica</button>
    <button data-dir="recordings" data-t="car_grab">Grabaciones</button>
    <button data-dir="sd" data-t="car_sd">Tarjeta</button>
  </div>
  <div class="ruta" id="ruta" hidden></div>

  <div id="soltar">
    <span data-t="soltar_aca">Arrastra archivos aca o</span>
    <span id="elegir" data-t="elegilos">elegilos</span><br>
    <b id="pista-soltar"></b>
  </div>
  <input type="file" id="archivo" multiple hidden>

  <div id="barra"><i></i></div>
  <div id="previa" hidden><img id="previa-img" alt=""><div class="pie" id="previa-pie"></div></div>
  <ul class="lista" id="lista"></ul>
  <p class="sub" id="pista"></p>

  <p class="sub" id="tarjeta-libre"></p>
</div>
<div id="brindis"></div>

<script src="/aos.js"></script>
<script>
const TR = {
  en: {
    titulo: "Files",
    bajada: "What is on the microSD, by folder. Drag to upload; tap a photo to see it.",
    act_ver: "view", tarjeta_libre: "%f free of %t", cerrar: "close",
    car_apps: "Apps", car_fotos: "Photos", car_musica: "Music",
    car_grab: "Recordings",
    car_sd: "Card", d_sd: "any file, into the folder you are looking at",
    h_sd: "The whole card. The four tabs on the left are the folders the watch uses; the rest is yours. A folder only goes when it is empty.",
    act_abrir: "open", b_nueva: "New folder", ph_carpeta: "Name of the new folder", carpeta_creada: "folder created",
    no_borrar: "could not delete: is the folder empty?", raiz: "card",
    soltar_aca: "Drop files here or",
    elegilos: "pick them",
    sin_conexion: "no connection to the watch",
    vacio: "no files yet",
    act_escuchar: "listen", act_bajar: "download", act_borrar: "delete",
    confirmar: "Delete %s?",
    borrado: "deleted", listo: "done", fallo: "failed ",
    d_apps: ".so built for ESP32-S3",
    h_apps: "Apps load at boot. After uploading one, restart the watch.",
    d_fotos: ".jpg, .png or .bmp",
    h_fotos: "They look best at 368x448. Bigger ones are rescaled on the fly.",
    d_musica: ".wav or .mp3",
    h_musica: "16-bit PCM WAV is the one that costs the least CPU.",
    d_grab: ".wav you want to keep on the watch",
    h_grab: "What the Recorder app makes: 16-bit mono PCM WAV at 16 kHz. " +
            "Listening opens them in the browser player; to seek, download it."
  },
  de: {
    titulo: "Dateien",
    bajada: "Was auf der microSD ist, nach Ordner. Ziehen zum Hochladen; ein Foto antippen, um es zu sehen.",
    act_ver: "ansehen", tarjeta_libre: "%f frei von %t", cerrar: "schliessen",
    car_apps: "Apps", car_fotos: "Fotos", car_musica: "Musik",
    car_grab: "Aufnahmen",
    car_sd: "Karte", d_sd: "jede Datei, in den Ordner, den du gerade siehst",
    h_sd: "Die ganze Karte. Die vier Reiter links sind die Ordner der Uhr; der Rest gehoert dir. Ein Ordner geht nur weg, wenn er leer ist.",
    act_abrir: "oeffnen", b_nueva: "Neuer Ordner", ph_carpeta: "Name des neuen Ordners", carpeta_creada: "Ordner angelegt",
    no_borrar: "konnte nicht loeschen: ist der Ordner leer?", raiz: "Karte",
    soltar_aca: "Dateien hierher ziehen oder",
    elegilos: "auswaehlen",
    sin_conexion: "keine Verbindung zur Uhr",
    vacio: "noch keine Dateien",
    act_escuchar: "anhoeren", act_bajar: "laden", act_borrar: "loeschen",
    confirmar: "%s loeschen?",
    borrado: "geloescht", listo: "fertig", fallo: "fehlgeschlagen ",
    d_apps: ".so fuer den ESP32-S3 gebaut",
    h_apps: "Apps werden beim Start geladen. Nach dem Hochladen die Uhr neu starten.",
    d_fotos: ".jpg, .png oder .bmp",
    h_fotos: "Am besten in 368x448. Groessere werden im Flug skaliert.",
    d_musica: ".wav oder .mp3",
    h_musica: "16-Bit-PCM-WAV braucht am wenigsten CPU.",
    d_grab: ".wav, die du auf der Uhr behalten willst",
    h_grab: "Was die Recorder-App aufnimmt: 16-Bit-PCM-WAV mono mit 16 kHz. " +
            "Anhoeren oeffnet sie im Browser-Player; zum Spulen herunterladen."
  }
};

/* El espanol vive en el HTML; aca solo lo que arma el JavaScript. */
const ES = {
  sin_conexion: "sin conexión con el reloj",
  vacio: "no hay archivos todavía",
  act_escuchar: "escuchar", act_bajar: "bajar", act_borrar: "borrar",
  confirmar: "¿Borrar %s?",
  borrado: "borrado", listo: "listo", fallo: "falló ",
  act_ver: "ver", tarjeta_libre: "%f libres de %t", cerrar: "cerrar",
  d_sd: "cualquier archivo, a la carpeta que estás mirando",
  h_sd: "La tarjeta entera. Las cuatro pestañas de la izquierda son las carpetas que usa el reloj; el resto es tuyo. Una carpeta sólo se borra vacía.",
  act_abrir: "abrir", b_nueva: "Nueva carpeta", ph_carpeta: "Nombre de la carpeta nueva",
  carpeta_creada: "carpeta creada", no_borrar: "no se pudo borrar: ¿la carpeta está vacía?", raiz: "tarjeta",
  d_apps: ".so compilados para ESP32-S3",
  h_apps: "Las apps se cargan al arrancar. Después de subir una, reiniciá el reloj.",
  d_fotos: ".jpg, .png o .bmp",
  h_fotos: "Se ven mejor a 368x448. Las más grandes se reescalan al vuelo.",
  d_musica: ".wav o .mp3",
  h_musica: "WAV PCM 16 bits es lo que menos CPU consume.",
  d_grab: ".wav que quieras dejar en el reloj",
  h_grab: "Lo que graba la app Grabadora: WAV PCM 16 bits mono a 16 kHz. " +
          "Escucharlas las abre en el reproductor del navegador; para adelantar, bajala."
};

const $ = aos.$;
function t(k) { const v = aos.t(k); return v === k ? ES[k] : v; }

/* Cada carpeta con su pista: que se puede subir, y que conviene saber. */
const PISTAS = {
  apps:       { soltar: "d_apps",   pie: "h_apps"   },
  photos:     { soltar: "d_fotos",  pie: "h_fotos"  },
  music:      { soltar: "d_musica", pie: "h_musica" },
  recordings: { soltar: "d_grab",   pie: "h_grab"   },
  sd:         { soltar: "d_sd",     pie: "h_sd"     }
};

/* La pestana Tarjeta navega: dir vale "sd", "sd/fotos viejas", etc. Las
   barras van tal cual en la URL y el resto se codifica; el firmware decodifica
   el parametro entero. */
function urlDir() { return encodeURIComponent(dir).replace(/%2F/gi, "/"); }
function esTarjeta() { return dir === "sd" || dir.startsWith("sd/"); }

function pintarRuta() {
  const r = $("ruta");
  if (!esTarjeta()) { r.hidden = true; return; }
  r.hidden = false;
  r.innerHTML = "";
  const partes = dir.split("/");          /* ["sd", "a", "b"] */
  partes.forEach((p, i) => {
    if (i) { const sep = document.createElement("span"); sep.className = "sep"; sep.textContent = "/"; r.append(sep); }
    const aca = i === partes.length - 1;
    const el = document.createElement(aca ? "b" : "a");
    el.textContent = i === 0 ? t("raiz") : p;
    if (!aca) { el.href = "#"; el.onclick = e => { e.preventDefault(); irA(partes.slice(0, i + 1).join("/")); }; }
    r.append(el);
  });
  const nueva = document.createElement("button");
  nueva.className = "sec chica";
  nueva.textContent = t("b_nueva");
  nueva.onclick = async () => {
    const nombre = prompt(t("ph_carpeta"));
    if (!nombre) return;
    const res = await fetch(`/api/mkdir?dir=${urlDir()}&name=${encodeURIComponent(nombre)}`, { method: "POST" });
    const j = await res.json().catch(() => ({}));
    aos.brindis(j.ok ? t("carpeta_creada") : t("fallo") + nombre);
    refrescar();
  };
  r.append(nueva);
}

function irA(nuevoDir) {
  dir = nuevoDir;
  $("previa").hidden = true;
  pintarRuta();
  refrescar();
}

let dir = "apps";
const listaEl = $("lista"), barraEl = $("barra"), rellenoEl = barraEl.firstElementChild;

const humano = aos.humano;

function verFoto(nombre, url) {
  const p = $("previa");
  if (!p.hidden && $("previa-img").dataset.nombre === nombre) { p.hidden = true; return; }
  $("previa-img").src = url;
  $("previa-img").dataset.nombre = nombre;
  $("previa-pie").textContent = nombre;
  p.hidden = false;
  p.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
$("previa").onclick = () => { $("previa").hidden = true; };

function pintarPistas() {
  $("pista-soltar").textContent = t(PISTAS[dir].soltar);
  $("pista").textContent = t(PISTAS[dir].pie);
}

async function refrescar() {
  listaEl.innerHTML = "";
  let datos;
  try {
    datos = await (await fetch(`/api/list?dir=${urlDir()}`)).json();
  } catch (e) {
    listaEl.innerHTML = '<div class="vacio">' + aos.esc(t("sin_conexion")) + "</div>";
    return;
  }
  if (!datos.files || !datos.files.length) {
    listaEl.innerHTML = '<div class="vacio">' + aos.esc(t("vacio")) + "</div>";
    return;
  }
  const ordenados = datos.files.slice().sort((a, b) =>
    (b.dir ? 1 : 0) - (a.dir ? 1 : 0) || a.name.localeCompare(b.name));
  for (const f of ordenados) {
    const li = document.createElement("li");
    const nombre = document.createElement("span");
    nombre.className = "nombre";
    /* El nombre sale de la tarjeta, o sea de afuera: textContent siempre. */
    nombre.textContent = f.name;

    if (f.dir) {
      /* Una carpeta: se entra tocandola. Borrar solo si esta vacia, y eso lo
         decide el reloj. */
      li.classList.add("carpeta");
      const abrir = document.createElement("a");
      abrir.className = "act";
      abrir.textContent = t("act_abrir");
      abrir.href = "#";
      const entrar = e => { e.preventDefault(); irA(dir + "/" + f.name); };
      abrir.onclick = entrar;
      nombre.onclick = entrar;
      const borrar = document.createElement("button");
      borrar.textContent = t("act_borrar");
      borrar.onclick = async e => {
        e.stopPropagation();
        if (!confirm(t("confirmar").replace("%s", f.name))) return;
        const res = await fetch(`/api/delete?dir=${urlDir()}&name=${encodeURIComponent(f.name)}`, { method: "POST" });
        aos.brindis(res.ok ? t("borrado") : t("no_borrar"));
        refrescar();
      };
      li.append(nombre, abrir, borrar);
      listaEl.append(li);
      continue;
    }
    const tam = document.createElement("span");
    tam.className = "detalle";
    tam.textContent = humano(f.size);
    const url = `/api/download?dir=${urlDir()}&name=${encodeURIComponent(f.name)}`;

    /* Escuchar solo donde tiene sentido. El enlace va sin "dl", asi que el
       reloj lo manda inline y lo abre el reproductor del navegador. Las fotos
       se ven aca mismo, arriba de la lista. */
    let sonar = null;
    if (/\.(wav|mp3)$/i.test(f.name)) {
      sonar = document.createElement("a");
      sonar.className = "act";
      sonar.textContent = t("act_escuchar");
      sonar.href = url;
      sonar.target = "_blank";
      sonar.rel = "noopener";
    } else if (/\.(jpe?g|png|bmp)$/i.test(f.name)) {
      sonar = document.createElement("a");
      sonar.className = "act";
      sonar.textContent = t("act_ver");
      sonar.href = url;
      sonar.onclick = e => { e.preventDefault(); verFoto(f.name, url); };
    }

    const bajar = document.createElement("a");
    bajar.className = "act";
    bajar.textContent = t("act_bajar");
    bajar.href = url + "&dl=1";

    const borrar = document.createElement("button");
    borrar.textContent = t("act_borrar");
    borrar.onclick = async () => {
      if (!confirm(t("confirmar").replace("%s", f.name))) return;
      const res = await fetch(`/api/delete?dir=${urlDir()}&name=${encodeURIComponent(f.name)}`,
                              { method: "POST" });
      aos.brindis(res.ok ? t("borrado") : t("no_borrar"));
      refrescar();
    };
    li.append(nombre, tam);
    if (sonar) li.append(sonar);
    li.append(bajar, borrar);
    listaEl.append(li);
  }
}

async function subir(archivos) {
  barraEl.style.display = "block";
  for (let i = 0; i < archivos.length; i++) {
    const f = archivos[i];
    rellenoEl.style.width = (i / archivos.length * 100) + "%";
    try {
      const res = await fetch(
        `/api/upload?dir=${urlDir()}&name=${encodeURIComponent(f.name)}`,
        { method: "POST", body: f });
      if (!res.ok) throw new Error(await res.text());
    } catch (e) {
      aos.brindis(t("fallo") + f.name);
      break;
    }
  }
  rellenoEl.style.width = "100%";
  setTimeout(() => { barraEl.style.display = "none"; rellenoEl.style.width = "0"; }, 400);
  aos.brindis(t("listo"));
  refrescar();
}


aos.alEstado(s => {
  $("tarjeta-libre").textContent = s.sd && s.sd_total
    ? t("tarjeta_libre").replace("%f", humano(s.sd_free)).replace("%t", humano(s.sd_total))
    : "";
});

document.querySelectorAll(".carpetas button").forEach(b => {
  b.onclick = () => {
    document.querySelectorAll(".carpetas button").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    dir = b.dataset.dir;
    $("previa").hidden = true;
    pintarPistas();
    pintarRuta();
    refrescar();
  };
});

const zona = $("soltar"), entrada = $("archivo");
$("elegir").onclick = () => entrada.click();
entrada.onchange = () => subir(entrada.files);
zona.ondragover = e => { e.preventDefault(); zona.classList.add("caliente"); };
zona.ondragleave = () => zona.classList.remove("caliente");
zona.ondrop = e => {
  e.preventDefault();
  zona.classList.remove("caliente");
  subir(e.dataTransfer.files);
};

aos.init(TR).then(() => {
  pintarPistas();
  refrescar();
});
</script>
</body>
</html>
